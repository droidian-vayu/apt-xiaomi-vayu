name: Download files

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download files
        run: |
          cd pool/trixie/main/binary-arm64
          wget http://ftp.debian.org/debian/pool/main/q/quirc/libquirc1_1.2-1+b1_arm64.deb
          wget http://ftp.debian.org/debian/pool/main/f/ffmpeg/libavcodec62_8.1.2-2+b3_arm64.deb
          wget http://ftp.debian.org/debian/pool/main/f/ffmpeg/libavformat62_8.1.2-2+b3_arm64.deb
          wget http://ftp.debian.org/debian/pool/main/f/ffmpeg/libavutil60_8.1.2-2+b3_arm64.deb
          wget http://ftp.debian.org/debian/pool/main/f/ffmpeg/libswscale9_8.1.2-2+b3_arm64.deb

      - name: Commit downloaded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pool/trixie/main/binary-arm64/
          git commit -m "Add Debian deb downloaded files" || echo "No changes"
          git push
